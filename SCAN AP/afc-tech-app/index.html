<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AFC Tech" />
    <title>AFC</title>
    <script>
      (function () {
        try {
          var client = (location.pathname || "").indexOf("/client") === 0;
          if (client) {
            var t = localStorage.getItem("client_appearance");
            document.documentElement.setAttribute("data-theme", t === "afc-dark" ? "afc-dark" : "afc");
            document.documentElement.style.colorScheme = t === "afc-dark" ? "dark" : "light";
            document.title = "AFC Hospital Portal";
            var m = document.querySelector('link[rel="manifest"]');
            if (m) m.setAttribute("href", "/client-manifest.webmanifest");
            var theme = document.querySelector('meta[name="theme-color"]');
            if (theme) theme.setAttribute("content", "#0a4d8c");
            var appTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (appTitle) appTitle.setAttribute("content", "AFC Portal");
          }
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "afc");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
